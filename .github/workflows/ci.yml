name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # A stuck native/file lock should fail the job rather than consume a runner indefinitely.
    timeout-minutes: 35
    # CI is intentionally offline: never depend on a developer-local PostgreSQL instance.
    env:
      SUPERAI_MEMORY_BACKEND: memory
      SUPERAI_EMBEDDING_HASH: '1'
      # The MCP knowledge graph has its own DSN; keep it offline as well.
      SUPERAI_KG_DSN: sqlite:///./.superai-ci-kg.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The protected suite is validated on the current supported CPython release.
          python-version: '3.14'
      - name: Install
        run: pip install -e ".[dev]"
      # Run learning lifecycle tests in a fresh process. Earlier integration tests can leave
      # process-local state behind on Windows runners; this keeps the full suite deterministic.
      - name: Pytest (core)
        run: >-
          pytest -q --timeout=300 --timeout-method=thread
          --ignore=tests/test_learning.py
          --ignore=tests/test_learning_engine_gaps.py
          --ignore=tests/test_learning_lifecycle_m061_m063.py
      - name: Pytest (learning lifecycle)
        run: >-
          pytest -q --timeout=300 --timeout-method=thread
          tests/test_learning.py
          tests/test_learning_engine_gaps.py
          tests/test_learning_lifecycle_m061_m063.py
      - name: Init + mock run
        run: |
          superai init --non-interactive
          superai run "say hello" --format json
      - name: Backup create + verify
        run: |
          superai backup --full
          superai backup-verify
