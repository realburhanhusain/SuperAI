name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # File-level isolation prevents process-global test backend and lock leaks.
    timeout-minutes: 55
    env:
      SUPERAI_MEMORY_BACKEND: memory
      SUPERAI_EMBEDDING_HASH: '1'
      SUPERAI_KG_DSN: sqlite:///./.superai-ci-kg.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest (isolated files)
        shell: pwsh
        run: |
          Get-ChildItem tests/test_*.py | ForEach-Object {
            python -m pytest -q --timeout=300 --timeout-method=thread $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Init + mock run
        run: |
          superai init --non-interactive
          superai run "say hello" --format json
      - name: Backup create + verify
        run: |
          superai backup --full
          superai backup-verify