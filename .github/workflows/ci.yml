name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # A stuck native/file lock should fail the job rather than consume a runner indefinitely.
    timeout-minutes: 35
    # CI is intentionally offline: never depend on a developer-local PostgreSQL instance.
    env:
      SUPERAI_MEMORY_BACKEND: memory
      SUPERAI_EMBEDDING_HASH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The protected suite is validated on the current supported CPython release.
          python-version: '3.14'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q --timeout=300 --timeout-method=thread
      - name: Init + mock run
        run: |
          superai init --non-interactive
          superai run "say hello" --format json
      - name: Backup create + verify
        run: |
          superai backup --full
          superai backup-verify
