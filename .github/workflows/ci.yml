name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # A stuck native/file lock should fail the job rather than consume a runner indefinitely.
    timeout-minutes: 35
    # CI is intentionally offline: never depend on a developer-local PostgreSQL instance.
    env:
      SUPERAI_MEMORY_BACKEND: memory
      SUPERAI_EMBEDDING_HASH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The protected suite is validated on the current supported CPython release.
          python-version: '3.14'
      - name: Install
        run: pip install -e ".[dev]"
      # Run learning lifecycle tests in a fresh process. Earlier integration tests can leave\r\n      # process-local state behind on Windows runners; this keeps the full suite deterministic.\r\n      - name: Pytest (core)\r\n        run: >-\r\n          pytest -q --timeout=300 --timeout-method=thread\r\n          --ignore=tests/test_learning.py\r\n          --ignore=tests/test_learning_engine_gaps.py\r\n          --ignore=tests/test_learning_lifecycle_m061_m063.py\r\n      - name: Pytest (learning lifecycle)\r\n        run: >-\r\n          pytest -q --timeout=300 --timeout-method=thread\r\n          tests/test_learning.py\r\n          tests/test_learning_engine_gaps.py\r\n          tests/test_learning_lifecycle_m061_m063.py\r\n      - name: Init + mock run
        run: |
          superai init --non-interactive
          superai run "say hello" --format json
      - name: Backup create + verify
        run: |
          superai backup --full
          superai backup-verify
